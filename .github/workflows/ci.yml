name: CI

concurrency: ci-${{ github.ref }}

on:
    push:
        branches: [develop]
        paths:
            - "src/**/*.rs"
            - .rust-version
            - ".github/workflows/**"
    workflow_dispatch:

jobs:
    tests:
        name: Build/test
        runs-on: ubuntu-latest
        permissions:
            contents: write

        steps:
            - uses: actions/checkout@v6
            - name: Get language version
              id: get_lang_version
              run: |
                    v=$(cat .rust-version)
                    echo "lang_version=$v" >> $GITHUB_OUTPUT
            - name: Install Rust
              uses: dtolnay/rust-toolchain@stable
              with:
                  targets: x86_64-unknown-linux-musl
            - name: Build
              run: |
                  cargo build --verbose
            - name: Test
              run: |
                  cargo test --verbose
            - name: Lint (clippy)
              run: |
                  cargo clippy --verbose
            - name: Install cargo-tarpaulin
              uses: taiki-e/install-action@v2
              with:
                  tool: cargo-tarpaulin
            - name: Coverage (tarpaulin)
              run: |
                  mkdir -p coverage
                  cargo tarpaulin --engine llvm --out Html --out Xml --output-dir coverage | tee coverage/tarpaulin-output.txt
            - name: Coverage summary
              run: |
                  echo "## Rust coverage" >> "$GITHUB_STEP_SUMMARY"
                  echo '```' >> "$GITHUB_STEP_SUMMARY"
                  cat coverage/tarpaulin-output.txt >> "$GITHUB_STEP_SUMMARY"
                  echo '```' >> "$GITHUB_STEP_SUMMARY"
            - name: Upload coverage artifact
              uses: actions/upload-artifact@v4
              with:
                  name: coverage-report
                  path: coverage/
            - name: Coverage threshold
              continue-on-error: true
              run: |
                  LINE_RATE=$(grep -oE '<coverage [^>]*line-rate="[0-9.]+"' coverage/cobertura.xml \
                      | grep -oE 'line-rate="[0-9.]+"' | grep -oE '[0-9.]+' || true)
                  LINE_RATE=${LINE_RATE:-0}
                  PCT=$(awk -v r="$LINE_RATE" 'BEGIN { printf "%.2f", r*100 }')
                  echo "Coverage: ${PCT}%"
                  awk -v pct="$PCT" 'BEGIN { exit !(pct+0 >= 0) }'
            - name: Coverage badge
              continue-on-error: true
              run: |
                  LINE_RATE=$(grep -oE '<coverage [^>]*line-rate="[0-9.]+"' coverage/cobertura.xml \
                      | grep -oE 'line-rate="[0-9.]+"' | grep -oE '[0-9.]+' || true)
                  LINE_RATE=${LINE_RATE:-0}
                  PCT=$(awk -v r="$LINE_RATE" 'BEGIN { printf "%.2f", r*100 }')
                  COLOR=$(awk -v p="$PCT" 'BEGIN { if (p>=80) print "brightgreen"; else if (p>=50) print "yellow"; else print "red" }')
                  printf '{"schemaVersion":1,"label":"coverage","message":"%s%%","color":"%s"}\n' \
                      "$PCT" "$COLOR" > coverage/coverage-badge.json
            - name: Publish coverage
              uses: peaceiris/actions-gh-pages@v4
              with:
                  github_token: ${{ secrets.GITHUB_TOKEN }}
                  publish_dir: ./coverage
                  destination_dir: coverage
