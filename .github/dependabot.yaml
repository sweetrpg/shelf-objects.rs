version: 2
updates:
    - package-ecosystem: "cargo"
      directory: "/"
      schedule:
          interval: "weekly"
          day: "monday"
      target-branch: "develop"
      open-pull-requests-limit: 5
    - package-ecosystem: "github-actions"
      directory: "/"
      schedule:
          interval: "daily"
      target-branch: "develop"
